<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Book</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #eeeae3;
      color: #292823;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: min(1100px, 92%);
      min-height: 650px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .book-cover {
      width: 430px;
      height: 570px;
      background: #29352d;
      border-radius: 6px 18px 18px 6px;
      box-shadow:
        20px 25px 50px rgba(30, 35, 30, 0.22),
        inset -12px 0 0 rgba(255,255,255,0.04);
      color: #f3efe7;
      padding: 55px 45px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .book-cover::before {
      content: "";
      position: absolute;
      left: 22px;
      top: 0;
      width: 2px;
      height: 100%;
      background: rgba(255,255,255,0.1);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 11px;
      color: #b9c2b8;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(48px, 7vw, 76px);
      line-height: 0.95;
      font-weight: 400;
    }

    .subtitle {
      margin-top: 22px;
      max-width: 270px;
      color: #c9cec8;
      line-height: 1.7;
      font-size: 14px;
    }

    .cover-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .recipe-count {
      font-size: 12px;
      color: #adb7ad;
    }

    .open-btn {
      border: 0;
      background: #e8e1d5;
      color: #29352d;
      padding: 14px 23px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .open-btn:hover {
      background: white;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .book-cover {
        width: 100%;
        max-width: 390px;
        height: 540px;
        padding: 45px 35px;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <section class="book-cover">
      <div>
        <div class="eyebrow">A personal collection</div>
      </div>

      <div>
        <h1>Recipe<br>Book</h1>
        <p class="subtitle">
          Simple recipes, carefully collected and ready for your kitchen.
        </p>
      </div>

      <div class="cover-bottom">
        <span class="recipe-count" id="recipeCount"></span>
        <button class="open-btn" onclick="openBook()">Open Book</button>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "virtualRecipeBook";

    function getRecipes() {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (saved) {
        return JSON.parse(saved);
      }

      const defaultRecipes = [
        {
          id: crypto.randomUUID(),
          title: "Creamy Garlic Pasta",
          category: "Dinner",
          cookTime: "25 minutes",
          ingredients: [
            "200g pasta",
            "3 cloves garlic",
            "1 cup heavy cream",
            "50g parmesan",
            "1 tbsp olive oil",
            "Salt and black pepper"
          ],
          steps: [
            "Cook pasta according to package instructions.",
            "Heat olive oil and sauté minced garlic.",
            "Add cream and simmer for 3 minutes.",
            "Stir in parmesan until smooth.",
            "Add pasta and season with salt and pepper."
          ],
          imageUrl: ""
        },
        {
          id: crypto.randomUUID(),
          title: "Classic Pancakes",
          category: "Breakfast",
          cookTime: "20 minutes",
          ingredients: [
            "1 cup flour",
            "2 tbsp sugar",
            "1 tsp baking powder",
            "1 egg",
            "3/4 cup milk",
            "2 tbsp melted butter"
          ],
          steps: [
            "Whisk the flour, sugar and baking powder.",
            "Add egg, milk and melted butter.",
            "Mix until just combined.",
            "Cook portions on a lightly buttered pan.",
            "Flip when bubbles appear and cook until golden."
          ],
          imageUrl: ""
        }
      ];

      localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultRecipes));
      return defaultRecipes;
    }

    function openBook() {
      window.location.href = "book.html";
    }

    document.getElementById("recipeCount").textContent =
      `${getRecipes().length} recipes`;
  </script>

</body>
</html>
