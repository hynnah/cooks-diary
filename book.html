<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Recipe Book</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #eeeae3;
      color: #292823;
    }

    header {
      height: 78px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-family: Georgia, serif;
      font-size: 25px;
      color: #29352d;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    button,
    .button {
      font-family: inherit;
      cursor: pointer;
    }

    .back-btn,
    .add-btn {
      padding: 10px 16px;
      border-radius: 3px;
      border: 1px solid #d5d0c7;
      background: transparent;
      color: #393832;
      font-size: 12px;
    }

    .add-btn {
      background: #29352d;
      color: white;
      border-color: #29352d;
    }

    .book-wrapper {
      min-height: calc(100vh - 78px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 20px 60px;
    }

    #book {
      width: 900px;
      height: 600px;
      max-width: 100%;
    }

    .page {
      background: #faf8f3;
      width: 100%;
      height: 100%;
      padding: 48px;
      position: relative;
      overflow: hidden;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.035),
          transparent 8%,
          transparent 92%,
          rgba(0,0,0,0.035)
        );
    }

    .toc {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .small-title {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 10px;
      color: #8c8b83;
      margin-bottom: 15px;
    }

    .toc h1 {
      font-family: Georgia, serif;
      font-size: 52px;
      font-weight: 400;
      margin-bottom: 45px;
      color: #29352d;
    }

    .toc-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 10px;
    }

    .toc-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid #ddd8cf;
      padding: 10px 0;
      text-align: left;
      font-family: Georgia, serif;
      font-size: 19px;
      color: #35352f;
    }

    .toc-number {
      color: #99968d;
      font-family: Inter, Arial, sans-serif;
      font-size: 11px;
      min-width: 24px;
    }

    .toc-item:hover {
      color: #687866;
    }

    .recipe-page {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .recipe-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .category {
      color: #72806f;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .recipe-title {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 38px;
      line-height: 1.1;
    }

    .cook-time {
      white-space: nowrap;
      color: #77766f;
      font-size: 12px;
      padding-top: 8px;
    }

    .recipe-image {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 3px;
      margin-bottom: 25px;
    }

    .recipe-content {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 35px;
      overflow-y: auto;
      flex: 1;
    }

    .section-title {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 10px;
      color: #8c8b83;
      margin-bottom: 13px;
    }

    .ingredients,
    .steps {
      padding-left: 18px;
      color: #53524b;
      font-size: 13px;
      line-height: 1.7;
    }

    .ingredients li,
    .steps li {
      margin-bottom: 8px;
    }

    .recipe-actions {
      margin-top: 20px;
      display: flex;
      gap: 8px;
    }

    .edit-btn,
    .delete-btn {
      padding: 9px 14px;
      font-size: 11px;
      border-radius: 3px;
      border: 1px solid #d6d1c7;
      background: transparent;
    }

    .edit-btn {
      background: #29352d;
      color: white;
      border-color: #29352d;
    }

    .delete-btn {
      color: #8d4e4e;
    }

    .add-page {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      cursor: pointer;
    }

    .plus {
      width: 70px;
      height: 70px;
      border: 1px solid #bdb9b0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      font-weight: 200;
      color: #77766f;
      margin-bottom: 20px;
    }

    .add-page h2 {
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: 400;
      margin-bottom: 8px;
    }

    .add-page p {
      font-size: 12px;
      color: #89877f;
    }

    .empty {
      color: #8c8b83;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 700px) {
      header {
        padding: 0 20px;
      }

      .brand {
        font-size: 21px;
      }

      .book-wrapper {
        padding: 10px;
      }

      #book {
        height: 650px;
      }

      .page {
        padding: 30px;
      }

      .recipe-content {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .recipe-image {
        height: 130px;
      }

      .recipe-title {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">Recipe Book</div>

    <div class="header-actions">
      <button class="back-btn" onclick="location.href='index.html'">
        Home
      </button>

      <button class="add-btn" onclick="location.href='recipe-form.html'">
        Add Recipe
      </button>
    </div>
  </header>

  <main class="book-wrapper">
    <div id="book"></div>
  </main>

  <script>
    const STORAGE_KEY = "virtualRecipeBook";

    let recipes = getRecipes();

    function getRecipes() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    }

    function saveRecipes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
    }

    function escapeHTML(value) {
      const div = document.createElement("div");
      div.textContent = value || "";
      return div.innerHTML;
    }

    function renderTOC() {
      if (!recipes.length) {
        return `
          <div class="toc">
            <div class="small-title">Contents</div>
            <h1>My Recipes</h1>
            <p class="empty">
              Your recipe collection is empty.<br>
              Use the Add Recipe button to create your first recipe.
            </p>
          </div>
        `;
      }

      return `
        <div class="toc">
          <div class="small-title">Contents</div>
          <h1>My Recipes</h1>

          <div class="toc-list">
            ${recipes.map((recipe, index) => `
              <button
                class="toc-item"
                onclick="goToRecipe(${index})"
              >
                <span class="toc-number">
                  ${String(index + 1).padStart(2, "0")}
                </span>
                <span>${escapeHTML(recipe.title)}</span>
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderRecipe(recipe, index) {
      const image = recipe.imageUrl
        ? `
          <img
            class="recipe-image"
            src="${escapeHTML(recipe.imageUrl)}"
            alt="${escapeHTML(recipe.title)}"
            onerror="this.style.display='none'"
          >
        `
        : "";

      return `
        <div class="recipe-page">
          <div class="recipe-top">
            <div>
              <div class="category">
                ${escapeHTML(recipe.category || "Recipe")}
              </div>

              <h1 class="recipe-title">
                ${escapeHTML(recipe.title)}
              </h1>
            </div>

            <div class="cook-time">
              ${escapeHTML(recipe.cookTime || "—")}
            </div>
          </div>

          ${image}

          <div class="recipe-content">
            <div>
              <div class="section-title">Ingredients</div>

              <ul class="ingredients">
                ${(recipe.ingredients || []).map(item => `
                  <li>${escapeHTML(item)}</li>
                `).join("")}
              </ul>
            </div>

            <div>
              <div class="section-title">Method</div>

              <ol class="steps">
                ${(recipe.steps || []).map(step => `
                  <li>${escapeHTML(step)}</li>
                `).join("")}
              </ol>
            </div>
          </div>

          <div class="recipe-actions">
            <button
              class="edit-btn"
              onclick="editRecipe('${recipe.id}')"
            >
              Edit
            </button>

            <button
              class="delete-btn"
              onclick="deleteRecipe('${recipe.id}')"
            >
              Delete
            </button>
          </div>
        </div>
      `;
    }

    function renderAddPage() {
      return `
        <div
          class="add-page"
          onclick="location.href='recipe-form.html'"
        >
          <div class="plus">+</div>
          <h2>Add a Recipe</h2>
          <p>Click to create a new page</p>
        </div>
      `;
    }

    function buildBook() {
      const bookElement = document.getElementById("book");

      bookElement.innerHTML = "";

      const pages = [];

      pages.push(`
        <div class="page">
          ${renderTOC()}
        </div>
      `);

      recipes.forEach((recipe, index) => {
        pages.push(`
          <div class="page">
            ${renderRecipe(recipe, index)}
          </div>
        `);
      });

      pages.push(`
        <div class="page">
          ${renderAddPage()}
        </div>
      `);

      bookElement.innerHTML = pages.join("");

      const pageFlip = new St.PageFlip(bookElement, {
        width: 450,
        height: 600,
        size: "stretch",
        minWidth: 280,
        maxWidth: 450,
        minHeight: 400,
        maxHeight: 650,
        maxShadowOpacity: 0.25,
        showCover: false,
        mobileScrollSupport: true,
        usePortrait: true
      });

      pageFlip.loadFromHTML(
        bookElement.querySelectorAll(".page")
      );

      window.pageFlip = pageFlip;
    }

    function goToRecipe(index) {
      if (!window.pageFlip) return;

      const pageNumber = index + 1;
      window.pageFlip.flip(pageNumber);
    }

    function editRecipe(id) {
      location.href =
        `recipe-form.html?id=${encodeURIComponent(id)}`;
    }

    function deleteRecipe(id) {
      const recipe = recipes.find(item => item.id === id);

      if (!recipe) return;

      const confirmed = confirm(
        `Delete "${recipe.title}"? This cannot be undone.`
      );

      if (!confirmed) return;

      recipes = recipes.filter(item => item.id !== id);
      saveRecipes();

      buildBook();
    }

    buildBook();
  </script>

</body>
</html>
